<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mein RPG</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #1b2a1f;
        overflow: hidden;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #version {
        position: fixed;
        left: 6px;
        bottom: 4px;
        font: 11px monospace;
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="version"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
