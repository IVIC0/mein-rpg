<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogoi Offline</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #1b2a1f;
        overflow: hidden;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #version {
        position: fixed;
        left: 6px;
        bottom: 4px;
        font: 11px monospace;
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <!-- "no-game": Solange noch kein Spiel läuft (Namenseingabe, Slot-Auswahl), sind die Anzeigen ausgeblendet. -->
  <body class="no-game">
    <div id="game"></div>

    <!-- Name, Stufe und Lebensbalken über der eigenen Figur und jedem Gegner (füllt src/ui/Nameplates.ts). -->
    <div id="nameplates"></div>

    <!-- Schadenszahlen, die über der Welt aufsteigen (füllt src/ui/FloatingText.ts). -->
    <div id="floaters"></div>

    <!-- Anzeigen über dem Spielbild. Aussehen: src/ui/hud.css, Werte: src/ui/Hud.ts. -->
    <div id="hud">
      <!-- Spielerrahmen, Zielrahmen, Skill-Leiste und Beute-Liste lassen sich in den Einstellungen
           ausblenden, skalieren und im Bearbeitungsmodus verschieben (src/ui/HudLayout.ts). -->
      <div class="frame" id="player-frame">
        <div class="frame-title">
          <span id="player-name"></span>
          <span id="player-level"></span>
        </div>
        <div class="bar bar-hp">
          <div class="bar-fill" id="player-hp-fill"></div>
          <span id="player-hp-text"></span>
        </div>
        <div class="bar bar-xp">
          <div class="bar-fill" id="player-xp-fill"></div>
          <span id="player-xp-text"></span>
        </div>
        <div id="player-buffs"></div>
      </div>

      <div class="frame" id="target-frame" hidden>
        <div class="frame-title">
          <span id="target-name"></span>
          <span id="target-level"></span>
        </div>
        <div id="target-rank"></div>
        <div class="bar bar-hp">
          <div class="bar-fill" id="target-hp-fill"></div>
          <span id="target-hp-text"></span>
        </div>
      </div>

      <div id="levelup">
        <div id="levelup-title"></div>
        <div id="levelup-text"></div>
      </div>

      <div id="message"></div>
      <div id="skillbar"></div>

      <!-- Zuletzt aufgehobene Items (füllt Hud.logLoot). -->
      <div id="loot-log"></div>

      <!-- Knopf-Leiste oben rechts. Neue Knöpfe (Talente, Karte …) kommen hier dazu. -->
      <div id="topbar">
        <button id="bag-button" class="topbar-button" type="button" title="Charakter &amp; Inventar (I)">
          <span class="sprite-icon topbar-icon"></span>
        </button>
        <button id="saves-button" class="topbar-button" type="button" title="Spielstände">💾</button>
        <button id="settings-button" class="topbar-button" type="button" title="Einstellungen">⚙</button>
      </div>

      <!-- Spielstände: Slots laden, anlegen, löschen, exportieren, importieren (füllt src/ui/SaveMenu.ts). -->
      <div id="saves" hidden>
        <div class="window-title"><span id="saves-title">Spielstände</span></div>
        <div id="saves-body"></div>
      </div>

      <!-- Einstellungen (füllt src/ui/SettingsMenu.ts). -->
      <div id="settings" hidden>
        <div class="window-title"><span>Einstellungen</span></div>
        <!-- Die aufklappbaren Bereiche mit Häkchen und Reglern baut SettingsMenu.ts hier hinein. -->
        <div id="settings-body"></div>
        <button id="setting-edit-hud" type="button">HUD verschieben …</button>
        <button id="setting-reset-windows" type="button">Fenster zurücksetzen</button>
        <button id="setting-reset-all" type="button">Alles auf Standard</button>
      </div>

      <!-- Leiste im Bearbeitungsmodus: HUD-Elemente lassen sich dann mit der Maus ziehen. -->
      <div id="hud-edit-bar" hidden>
        <span>HUD verschieben: Elemente mit der Maus ziehen</span>
        <button id="hud-edit-reset" type="button">Plätze zurücksetzen</button>
        <button id="hud-edit-done" type="button">Fertig (Esc)</button>
      </div>

      <!-- Charakter & Inventar (Taste I oder C). Die Felder baut src/ui/InventoryWindow.ts. -->
      <div id="inventory" hidden>
        <!-- An der Titelzeile lässt sich das Fenster verschieben. -->
        <div class="window-title" id="inventory-title">
          <span>Charakter &amp; Inventar</span>
          <span class="window-buttons">
            <button id="inventory-pin" type="button" title="Anpinnen: Fenster bleibt offen (Esc schließt es nicht)">📌</button>
            <button id="inventory-close" type="button" title="Schließen (I)">×</button>
          </span>
        </div>
        <div class="window-columns">
          <div class="window-column">
            <!-- Name der Figur und ihre Klasse (trägt WorldScene.showName ein). -->
            <div id="character-name"></div>
            <div id="equipment"></div>
            <div id="character-stats"></div>
          </div>
          <div class="window-column">
            <div id="bag"></div>
            <div class="bag-footer">
              <span id="bag-count"></span>
              <span id="gold"></span>
            </div>
            <!-- Ist der Händler offen, ergänzt InventoryWindow.setShop hier "Rechtsklick: verkaufen". -->
            <div class="window-help" id="inventory-help">Linksklick: anlegen / ablegen<br />Umschalt + Linksklick: wegwerfen</div>
          </div>
        </div>
        <!-- Ecke unten rechts: daran lässt sich die Größe ziehen. -->
        <div id="inventory-resize" title="Größe ändern"></div>
      </div>

      <!-- Händler (Klick auf den Händler im Dorf). Das Sortiment baut src/ui/ShopWindow.ts. -->
      <div id="shop" hidden>
        <div class="window-title">
          <span>Händler</span>
          <span class="window-buttons">
            <button id="shop-close" type="button" title="Schließen (Esc)">×</button>
          </span>
        </div>
        <div id="shop-stock"></div>
        <div class="bag-footer">
          <span id="shop-restock"></span>
          <span id="shop-gold"></span>
        </div>
        <div id="shop-potion">
          <span class="shop-potion-icon"><span id="shop-potion-icon" class="sprite-icon"></span></span>
          <span id="shop-potion-text"></span>
          <button id="shop-potion-buy" type="button"></button>
        </div>
        <div class="window-help">Linksklick auf Ware: kaufen<br />Rechtsklick auf ein Item im Inventar: verkaufen</div>
      </div>
      <div id="item-tooltip" hidden></div>

      <div id="death-screen" hidden>
        <div class="death-title">Du bist gestorben</div>
        <div>Du erwachst gleich im Dorf …</div>
        <div id="death-loss"></div>
      </div>
    </div>

    <!-- Dialoge in der Bildmitte: Namenseingabe, Sicherheitsabfrage, Meldung (füllt src/ui/dialog.ts). -->
    <div id="dialog" hidden></div>

    <div id="version"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
